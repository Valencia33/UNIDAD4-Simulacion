<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Kuramoto DAW - Microsoft Internet Explorer</title>
  <link rel="stylesheet" href="/src/styles.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
</head>
<body>
  <div class="desktop">
    <div class="ie-window">

      <div class="title-bar">
        <div class="title-text">
          <img src="https://win98icons.alexmeub.com/icons/png/internet_explorer-4.png" alt="IE Icon" class="icon" style="width: 16px; height: 16px; margin-right: 5px;">
          Kuramoto Sequencer - Microsoft Internet Explorer
        </div>
        <div class="title-buttons">
          <button>_</button><button>□</button><button>X</button>
        </div>
      </div>

      <div class="menu-bar">
        <span><u>F</u>ile</span><span><u>E</u>dit</span><span><u>V</u>iew</span><span><u>G</u>o</span><span>F<u>a</u>vorites</span><span><u>H</u>elp</span>
      </div>

      <div class="toolbar">
        <button id="start-audio-btn" class="tool-btn" style="font-weight: bold; color: green;">▶ Start Audio Engine</button>
        <div class="tool-btn" id="toggle-monitor-btn">Sync Monitor</div>
        <div class="tool-btn">Refresh</div>
        <div class="address-bar">
          <span>Address</span>
          <input type="text" value="http://localhost:5173/kuramoto-daw" readonly>
        </div>
      </div>

      <div class="kuramoto-controls">
        <div class="control-group">
          <label>Global Sync (K): <span id="k-val">0.0</span></label>
          <input type="range" id="k-slider" min="0" max="5" step="0.1" value="0">
        </div>
        <div class="control-group">
          <!-- NUEVO: Ahora indica y controla los BPM -->
          <label>Tempo (BPM): <span id="bpm-val">120</span></label>
          <input type="range" id="bpm-slider" min="60" max="240" step="1" value="120">
        </div>
        <div class="control-group">
          <label>ω Spread: <span id="omega-val">0.50</span></label>
          <input type="range" id="omega-slider" min="0" max="2.5" step="0.05" value="0.5">
        </div>
        <button id="reset-btn">Reset Phases</button>
        <div class="state-readout state-disorder" id="global-state">Estado: —</div>
      </div>

      <div class="main-layout">
        <div id="app" class="viewport"></div>

        <div class="track-manager">
          <div class="manager-header">Track Manager</div>
          <div class="add-track-form">
            <select id="new-track-type">
              <option value="Kick">Kick (Percusión)</option>
              <option value="Snare">Snare (Caja)</option>
              <option value="HiHat">Hi-Hat (Platillo)</option>
              <option value="Bass">Bass (Bajo FM)</option>
              <option value="Chord">Chord (Sinte Poli)</option>
              <option value="Lead">Lead (Melodía)</option>
              <option value="Pluck">Pluck (Cuerda)</option>
              <option value="Glitch">Glitch (Arpegio Bm)</option>
            </select>
            <button id="add-track-btn">Add Track</button>
          </div>
          <div id="track-list" class="track-list">
            <!-- La lista de pistas se generará aquí vía JS -->
          </div>
        </div>
      </div>

      <div class="status-bar">
        <span id="audio-status">Audio: Offline</span>
        <span>My Computer</span>
      </div>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
